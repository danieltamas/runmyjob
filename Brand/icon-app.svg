<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#232A33"/>
      <stop offset="1" stop-color="#0B0E12"/>
    </linearGradient>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5B8CFF"/>
      <stop offset="1" stop-color="#2FD3C8"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <g filter="url(#drop)"><rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/></g>
  <rect x="102" y="102" width="820" height="820" rx="184" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="4"/>
  <!-- the route: one source on the left, two destinations on the right; the chosen branch is lit,
       the other is the dim alternative the rules skipped -->
  <path d="M292 512C420 512 420 348 548 348L700 348" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="56" stroke-linecap="round"/>
  <path d="M292 512C420 512 420 676 548 676L700 676" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="56" stroke-linecap="round"/>
  <path d="M292 512C420 512 420 348 548 348L700 348" fill="none" stroke="url(#route)" stroke-width="56" stroke-linecap="round" opacity="0.55" filter="url(#glow)"/>
  <path d="M292 512C420 512 420 348 548 348L700 348" fill="none" stroke="url(#route)" stroke-width="56" stroke-linecap="round"/>
  <!-- the source: the Mac -->
  <circle cx="292" cy="512" r="74" fill="#F4F7F9"/>
  <circle cx="292" cy="512" r="30" fill="#0B0E12"/>
  <!-- the chosen destination: a box, running (filled) -->
  <rect x="664" y="276" width="144" height="144" rx="34" fill="#2FD3C8"/>
  <path d="M722 318L768 348L722 378Z" fill="#0B0E12"/>
  <!-- the skipped destination: a box, idle (outlined) -->
  <rect x="676" y="616" width="120" height="120" rx="30" fill="none" stroke="#F4F7F9" stroke-opacity="0.35" stroke-width="18"/>
</svg>
